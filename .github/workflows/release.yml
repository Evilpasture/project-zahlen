name: Release (Ubuntu 22.04 baseline)

# What this lane is, and why it exists next to ci.yml.
#
# ci.yml builds on Arch and publishes container images. Those images carry their
# own libc, so they are self-consistent -- but any native artifact taken out of
# them needs whatever glibc the image had (2.43 at the time of writing, from
# three sqrtf/atan2f relocations), which is newer than Ubuntu 24.04 and every
# other LTS. The rule this workflow enforces is the one that matters to a user:
# the released toolchain is compiled against glibc 2.35 (Ubuntu 22.04) and is
# then installed, compiled against and run by a machine that has nothing but a
# normal dev environment and the release itself.
#
# Four jobs, deliberately different in kind:
#   version    resolve the engine tag from CMakeLists.txt and zpkg's CalVer from
#              the release date. Two version schemes, two sources of truth.
#   toolchain  build *inside* Ubuntu 22.04 (docker/release-jammy/Containerfile: apt
#              packages, and GCC 16 from the Ubuntu toolchain PPA since the tree
#              needs -freflection), package, sign with the PINNED project key,
#              check the artifacts against each other, and publish. A missing
#              key or a stale CalVer/fingerprint stops the release here.
#              This job runs no test suite: the full ztest gate for the commit
#              is ci.yml's "Test (release)" (unsanitised, current lavapipe).
#              A suite run on jammy could only fail at Vulkan device creation --
#              its Mesa 23.x is below the engine's driver floor -- while still
#              costing the compile of every test target.
#   consume    NO container, NO checkout of build outputs: a fresh jammy runner
#              downloads that release, trusts the pinned key, installs it with
#              zpkg as an unprivileged user, generates a link smoke test and
#              checks the glibc floor. It then installs the PREVIOUS release
#              into a second store and runs `zpkg sync` to this one: an upgrade
#              must never require another `key add`.
#   staleness  re-download the published assets AND the release body and check
#              that they still agree with the pinned key, the notes, the CalVer
#              and each other. A re-upload can replace every asset while the
#              body keeps advertising the old fingerprint; this is the guard.
#
# No rendered frame or consumer example is published: an "example" that a job
# has to untar and compile is a fixture with a version-dependent filename, not
# documentation. Device-level rendering is exercised by ci.yml on a current
# lavapipe; the release lane claims only "installs, links and loads on jammy".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (default: v + PROJECT_VERSION from CMakeLists.txt)"
        required: false
        default: ""
      gcc_version:
        description: "GCC version to download and build with (released 16.x; reflection needs 16)"
        required: false
        default: "16.2.0"

# Releases are created and updated with the workflow token.
permissions:
  contents: write

env:
  # RELEASE_TAG is per job, not here: it comes from the `version` job's outputs
  # (PROJECT_VERSION in CMakeLists.txt -- the one hand-written version number in
  # the tree), and the `needs` context is not available at workflow level. A
  # manual run may override it with `tag`, and a tag push must already agree with
  # the tree or the run stops before anything is built.
  GCC_VERSION: ${{ inputs.gcc_version || '16.2.0' }}
  # The installed binaries are named after the major (gcc-16 / g++-16), so the
  # pin above can move to 16.3 without touching a single CMake flag.
  GCC_BIN_SUFFIX: "16"
  # Ubuntu 22.04 LTS. Anything a release links must stay at or below this, or
  # the artifact only runs on a distro newer than the one it claims to target.
  GLIBC_BASELINE: "2.35"

# A release never runs concurrently with itself: two jobs publishing to the same
# tag would upload half of one build and half of another.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # One source of truth for the version, and everything downstream reads it here.
  # scripts/release-tag.sh is the same logic a release engineer runs by hand, and
  # tests/version_test.py (configure-time on Linux, here on every release) is the
  # copy check.
  version:
    name: Version (from CMakeLists.txt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      calver: ${{ steps.version.outputs.calver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve the version and the release tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
            version="${tag#v}"
          else
            version=$(scripts/release-tag.sh --print-version)
            tag=$(scripts/release-tag.sh)
          fi
          calver=$(date -u +%Y.%m.%d)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "calver=${calver}" >> "$GITHUB_OUTPUT"
          echo "release ${tag} (engine ${version}, zpkg CalVer ${calver})" >> "$GITHUB_STEP_SUMMARY"

      - name: A tag push must agree with the tree
        if: github.event_name == 'push'
        env:
          RESOLVED_TAG: ${{ steps.version.outputs.tag }}
        run: |
          expected=$(scripts/release-tag.sh)
          if [ "${expected}" != "${RESOLVED_TAG}" ]; then
            echo "error: tag ${RESOLVED_TAG} does not match PROJECT_VERSION ${expected}." >&2
            echo "       Bump CMakeLists.txt, or delete the tag and re-create it from that commit." >&2
            exit 1
          fi
          # Engine semver copies are checked here; zpkg's separate CalVer is
          # checked against the release date in the toolchain job below.
          python3 tests/version_test.py --check --tag "${RESOLVED_TAG}"

  toolchain:
    name: Toolchain (native Ubuntu 22.04, glibc 2.35)
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: PKGBUILD pin must reference an earlier commit
        run: scripts/pin-zpkg-pkgbuild.sh --check

      - name: Release key must be configured
        env:
          HAS_KEY: ${{ secrets.ZHLN_RELEASE_KEY_PEM != '' }}
        run: |
          if [ "${HAS_KEY}" != true ]; then
            echo "error: ZHLN_RELEASE_KEY_PEM secret is missing." >&2
            echo "       Run scripts/bootstrap-release-key.sh and set the secret;" >&2
            echo "       package-toolchain.sh refuses to invent a throwaway key." >&2
            exit 1
          fi

      # The compiler cache is what makes an iteration cheap: the build directory is
      # thrown away every run, so without it every translation unit -- including all
      # of slang -- is compiled again, to produce objects that were already correct.
      # There used to be a second cache here, for the cross-build sysroot. The build
      # is native now, so there is no sysroot to cache; the toolchain itself is a
      # Docker layer.
      - name: Restore the compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-

      # The tree is mounted into the image at run time rather than baked into it, so
      # these are just part of the checkout. All fourteen are needed by a *release*
      # build for a reason the journal records one by one: slang and glfw because the
      # engine links both and jammy has no slang at all and ships GLFW 3.3, the rest
      # because jammy holds no copy (simdjson 5.x, Vulkan headers 1.4) or one too old
      # for what the renderer targets.
      # --recursive is not optional: extern/slang builds from its own submodules
      # (miniz, lz4, cmark, spirv-headers, spirv-tools, glslang, unordered_dense)
      # and configures them as source directories. Without them the configure stops
      # with "does not contain a CMakeLists.txt" for each one.
      - name: Fetch vendored trees
        run: |
          git submodule update --init --recursive --depth 1 \
            extern/JoltPhysics \
            extern/VulkanMemoryAllocator \
            extern/Vulkan-Headers \
            extern/SPIRV-Reflect \
            extern/volk \
            extern/meshoptimizer \
            extern/mimalloc \
            extern/miniaudio \
            extern/cgltf \
            extern/clay \
            extern/stb \
            extern/glfw \
            extern/simdjson \
            extern/slang

      # Only needed when ZHLN_SLANG_VENDORED=ON builds the pinned tree instead of
      # using the prebuilt in the image: slang's own CMake takes its version from
      # `git describe`, and a shallow submodule has no tags, so ask the remote for
      # them explicitly and hand the result over as SLANG_VERSION_FULL.
      - name: Resolve the vendored slang version
        id: slang
        run: |
          git -C extern/slang fetch --tags --depth 1 origin || true
          version=$(git -C extern/slang describe --tags --abbrev=0 || true)
          if [ -z "${version}" ]; then
            version=$(git -C extern/slang log -1 --format=%cd --date=format:%Y.%m.%d || true)
            echo "warning: no slang tag found; using the checkout date '${version}'" >&2
          fi
          version=${version#v}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "vendored slang version: ${version}"

      # The release builder is only tooling: ubuntu:22.04 plus the jammy packages a
      # build needs. It clones the repository inside the image to get its
      # provisioning scripts (no build-context COPY), pinned to this commit;
      # the sources are still mounted at /workspace at run time. The GHA layer
      # cache restores everything else.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Ubuntu 22.04 release builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/release-jammy/Containerfile
          build-args: |
            ZHLN_GIT_URL=${{ github.server_url }}/${{ github.repository }}.git
            ZHLN_GIT_REF=${{ github.sha }}
          tags: zahlen-release-builder:jammy
          load: true
          cache-from: type=gha,scope=zahlen-release-builder
          cache-to: type=gha,mode=max,scope=zahlen-release-builder

      # Everything below runs as a user on a jammy machine: the compiler, binutils,
      # wayland-scanner and the libraries are the distro's own, so there is no target
      # prefix to mount and nothing foreign to run.
      - name: Build and package
        run: |
          # dist must exist here, created by this user, before docker runs: the
          # daemon creates a missing bind-mount source as root, and then every
          # write from the host into it fails -- `} > dist/release-notes.md` dies
          # with "Permission denied" after a build that succeeded completely. The
          # container still writes the packages as root; that is fine, they are
          # only ever read.
          rm -rf dist
          mkdir -p dist .ccache
          docker run --rm \
            -v "${PWD}:/workspace" -w /workspace \
            -v "${PWD}/dist:/dist" \
            -v "${PWD}/.ccache:/ccache" \
            -e CCACHE_DIR=/ccache \
            -e ZHLN_GLIBC_BASELINE="${GLIBC_BASELINE}" \
            -e ZHLN_SLANG_VERSION="${{ steps.slang.outputs.version }}" \
            -e ZHLN_RELEASE_KEY_PEM="${{ secrets.ZHLN_RELEASE_KEY_PEM }}" \
            -e ZHLN_RELEASE_KEY_PEM_PREVIOUS="${{ secrets.ZHLN_RELEASE_KEY_PEM_PREVIOUS }}" \
            zahlen-release-builder:jammy bash scripts/build-release-toolchain.sh /dist

      # A second look from the host, on the packaged archives rather than a build
      # tree: this is the same guard the consumer job applies after installing.
      - name: Check the glibc floor of the published packages
        run: scripts/check-glibc-floor.sh "${GLIBC_BASELINE}" dist/packages dist/tools

      - name: Write release notes
        run: |
          id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' dist/packages/toolchain.json)
          fingerprint=$(cat dist/tools/KEY-FINGERPRINT.txt)
          compiler=$(sed -n 's/.*"compiler":"\([^"]*\)".*/\1/p' dist/packages/toolchain.json)
          compiler_version=$(sed -n 's/.*"compiler_version":"\([^"]*\)".*/\1/p' dist/packages/toolchain.json)
          {
            echo "Toolchain \`${id}\`, ${compiler} ${compiler_version}."
            echo
            echo "* glibc baseline: **${GLIBC_BASELINE}**, enforced by \`scripts/check-glibc-floor.sh\`"
            echo "* release key fingerprint: \`${fingerprint}\` (pinned in \`packaging/keys/zahlen-release.pub\`)"
            backends=$(cat dist/window-backends.txt || echo 'wayland=ON x11=OFF')
            echo "* window backends: ${backends} (GLFW is vendored and static; Wayland is the primary backend)"
            echo "* built natively on Ubuntu 22.04 (no sysroot, no cross-compilation)"
            echo '* with that distro'"'"'s own released GCC 16. Consumers need GNU >= 16.1.1,'
            echo '  not the exact patch version that built this release.'
            echo
            echo '## Install'
            echo
            echo 'The project key is pinned in this repository. Trust it once:'
            echo
            echo '```sh'
            echo 'zpkg key add packaging/keys/zahlen-release.pub --name "zahlen release"'
            echo 'zpkg install . --require-checksums --require-signatures'
            echo '```'
            echo
            echo '## Upgrade'
            echo
            echo '```sh'
            echo 'zpkg sync --activate'
            echo '```'
            echo
            echo 'Requirements, the game build and the full upgrade flow are in'
            echo "[Consuming Zahlen](https://github.com/Evilpasture/project-zahlen/blob/${RELEASE_TAG}/docs/CONSUMING.md)"
            echo 'and [Upgrading](https://github.com/Evilpasture/project-zahlen/blob/${RELEASE_TAG}/docs/UPGRADING.md)'
            echo 'at this tag. No example project or rendered frame ships with the release:'
            echo 'an example that a job has to parse is a fixture, and fixtures belong to CI.'
            echo
            echo 'The engine and tools were compiled by a released GCC 16, so they need its'
            echo 'runtime at run time -- `GLIBCXX_3.4.36` and `GCC_13.0.0`, where 22.04 ships'
            echo '3.4.30. Nothing else is implied -- the release carries its own GLFW (static,'
            echo 'inside `libzahlen_engine`), so no `libglfw3` is required, and the GLIBC_2.35'
            echo 'floor is checked before'
            echo 'anything is published.'
          } > dist/release-notes.md
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # Catch the exact class of bug that produced five releases with a
      # fingerprint in the notes that did not match the published key.
      - name: Reject stale release assets and notes before publishing
        env:
          CALVER: ${{ needs.version.outputs.calver }}
        run: |
          scripts/check-release-consistency.sh \
            --assets dist/packages --tools dist/tools \
            --notes dist/release-notes.md \
            --versions --date "${CALVER}" \
            --zpkg dist/tools/zpkg-linux-x86_64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # stderr stays visible: an auth problem should say so, not look like a
          # missing release and send the run down the "create" branch.
          if gh release view "${RELEASE_TAG}" >/dev/null; then
            # Package names carry the commit hash, so `--clobber` can only ever
            # replace an asset built from the *same* commit: re-releasing the same
            # tag from a newer commit leaves the previous generation in place,
            # while the new SHA256SUMS describes only the new one. The release
            # then holds two sets of packages, and `zpkg install
            # --require-checksums` refuses the downloaded directory with
            # "<pkg> ... is missing from dist/SHA256SUMS" -- which is exactly how
            # the first green build after the dir fixes failed.
            #
            # A release has to carry one generation, so drop every asset this
            # build is not about to re-upload: what stays is exactly `dist/`.
            # No other job uploads assets to a release any more: the old render
            # job attached a frame afterwards, which let the body and the assets
            # describe two different generations. A release is exactly dist/.
            keep=$(cd dist && printf '%s\n' packages/* tools/* | sed 's|.*/||')
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                printf '%s\n' "${keep}" | grep -Fxq -- "${asset}" ||
                  gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
              done
            gh release upload "${RELEASE_TAG}" dist/packages/* dist/tools/* --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file dist/release-notes.md \
              dist/packages/* dist/tools/*
          fi
          gh release view "${RELEASE_TAG}" --json assets \
            --jq '.assets[] | "\(.size|tostring|.[0:7])B  \(.name)"' | sort

      # Saved even when the build failed -- that is precisely the case where the next
      # attempt should not start from zero. ccache writes each object as it compiles,
      # so a failure at 80% leaves 80% of the engine in here, and the next run
      # recompiles only the rest.
      #
      # Two things are deliberate rather than tidy:
      #   the key is written out here instead of taken from the restore step's
      #     `cache-primary-key`, so a restore that failed (cache service, expired
      #     entry) cannot leave this step with an empty key and lose the whole cache;
      #   the directory is created first, because an earlier step can fail before
      #     `mkdir -p .ccache` ever ran -- and `cache/save` treats a missing path as
      #     an error, which would paint a second red step over the real failure.
      - name: Make sure the compiler cache directory exists
        if: always()
        run: mkdir -p .ccache

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}

      # `if-no-files-found: warn`: when the build fails there is no dist/, and an
      # error here would just paint a second red step over the real failure.
      - name: Upload the packaged artifacts as a run artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zahlen-release-dist
          path: |
            dist/packages/
            dist/tools/
            dist/release-notes.md
          if-no-files-found: warn
          retention-days: 7

  consume:
    name: Consume the release (bare jammy, no container)
    needs: [version, toolchain]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      # This job deliberately downloads nothing but the release: the whole point
      # is that the published artifacts are sufficient. The repository is here
      # only for the environment script, which is the same one the build job ran
      # -- that is what makes "the runtime deps" identical on both sides.
      - name: Checkout repository (for the environment script only)
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: scripts

      - name: Download the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" -D dist
          ls -la dist

      # The compiler is not guessed from the workflow inputs: the toolchain
      # descriptor in the release says which GCC built it, and the package
      # config refuses any other compiler version.
      - name: Read the toolchain descriptor
        id: tc
        run: |
          id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' dist/toolchain.json)
          gcc=$(sed -n 's/.*"compiler_version":"\([0-9][0-9]*\).*/\1/p' dist/toolchain.json)
          profile=$(sed -n 's/.*"profile":"\([^"]*\)".*/\1/p' dist/toolchain.json)
          test -n "${id}" && test -n "${gcc}"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "gcc=${gcc}" >> "$GITHUB_OUTPUT"
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "toolchain ${id} (gcc ${gcc}, ${profile})"

      - name: Provision a normal dev environment
        run: scripts/ci-ubuntu-2204-env.sh --consumer --gcc "${{ steps.tc.outputs.gcc }}" --glibc-baseline "${GLIBC_BASELINE}"

      - name: Install the toolchain from the release, unprivileged
        run: |
          # A bare jammy runner has no ~/.local/bin and `install` does not create
          # leading directories: without this the step dies before it installs
          # anything, with "cannot create regular file ...: No such file or
          # directory", on a release that is perfectly good.
          mkdir -p "${HOME}/.local/bin"
          install -m755 dist/zpkg-linux-x86_64 "${HOME}/.local/bin/zpkg"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"
          zpkg --version
          # The manager binary ships separately from the packages, so it has its
          # own sums file (the packages' SHA256SUMS is zpkg's own contract).
          ( cd dist && sha256sum -c SHA256SUMS.tools )
          # Trust the key pinned in git history, NOT the one from this release
          # page. If the two differ, the install below refuses: that is the
          # whole point of an out-of-band trust anchor.
          zpkg key add packaging/keys/zahlen-release.pub --name "zahlen release"
          zpkg key list
          # No ZHLN_ROOT: the default per-user store is what a developer gets.
          zpkg install dist --require-checksums --require-signatures
          zpkg list
          zpkg prefix | tee "${RUNNER_TEMP}/prefix.txt"
          zpkg which zcook | tee "${RUNNER_TEMP}/zcook.txt"

      # A generated smoke fixture, not an example: nothing shipped in the
      # release is untarred here and no checked-in sample is compiled by CI.
      - name: Build a link smoke test against the installed toolchain
        run: |
          prefix=$(cat "${RUNNER_TEMP}/prefix.txt")
          mkdir -p consumer
          cat >consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(ZahlenConsumerSmoke LANGUAGES CXX)
          find_package(ZahlenApplication CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE Zahlen::Application)
          EOF
          cat >consumer/main.cpp <<'EOF'
          #include <Zahlen/App.hpp>

          int main(int argc, char* argv[]) {
              return ZHLN::App().Main(argc, argv);
          }
          EOF
          cmake -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="gcc-${{ steps.tc.outputs.gcc }}" \
            -DCMAKE_CXX_COMPILER="g++-${{ steps.tc.outputs.gcc }}" \
            -DCMAKE_PREFIX_PATH="${prefix}" \
            -DZahlen_SANITIZER_PROFILE="${{ steps.tc.outputs.profile }}"
          cmake --build consumer-build --verbose
          # Nothing may reach back into a checkout: the store is the only source.
          if grep -Fq "${GITHUB_WORKSPACE}/src" consumer-build/build.ninja; then
            echo 'FAIL: the consumer build references engine sources' >&2
            grep -Fn "${GITHUB_WORKSPACE}/src" consumer-build/build.ninja >&2
            exit 1
          fi
          # The installed packages must be self-contained. No rendered frame:
          # jammy's lavapipe is below the engine's Vulkan floor, and a device
          # check belongs to ci.yml's "Test (release)" job.
          env -u LD_LIBRARY_PATH ldd consumer-build/consumer | tee consumer-ldd.txt
          ! grep -q 'not found' consumer-ldd.txt
          # --help is handled before host/device creation, so this exercises
          # the CLI and the loader without needing a Vulkan driver.
          env -u LD_LIBRARY_PATH consumer-build/consumer --help >consumer-help.txt 2>&1
          test -s consumer-help.txt

      # the user's store -- the artifact the user runs, not the build tree.
      - name: Check the installed packages against the baseline
        run: scripts/check-glibc-floor.sh "${GLIBC_BASELINE}" "$(cat "${RUNNER_TEMP}/prefix.txt")"

      # The upgrade path was invisible to CI: every consume run started from an
      # empty store and added the just-downloaded key. This one starts from the
      # PREVIOUS release's store and must not need another `key add` for the
      # new release. A silently rotated (throwaway) key fails right here.
      - name: Upgrade from the previous release without re-adding a key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          previous=$(gh release list --limit 2 --exclude-drafts --exclude-prereleases \
            --json tagName --jq '.[1].tagName')
          test -n "${previous}"
          echo "previous release: ${previous}"
          mkdir -p prev-dist
          gh release download "${previous}" -D prev-dist

          # A separate store: an existing 0.5.x user, not the fresh install above.
          export ZHLN_ROOT="${RUNNER_TEMP}/upgrade-store"
          mkdir -p "${ZHLN_ROOT}"
          zpkg key add prev-dist/zahlen-release-key.pub --name "previous release"
          zpkg install prev-dist --require-checksums --require-signatures
          zpkg list

          # The one-time trust step for the long-lived project key. After this,
          # no `key add` may appear: sync must install the new release as-is.
          zpkg key add packaging/keys/zahlen-release.pub --name "zahlen release"
          zpkg sync --version "${RELEASE_TAG}" --activate
          zpkg list
          expected=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' dist/toolchain.json)
          test "$(zpkg list | awk '/\*/ {print $2}')" = "${expected}"

  staleness:
    name: Verify the published release is not stale
    needs: [version, toolchain, consume]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      CALVER: ${{ needs.version.outputs.calver }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository (checks, keys and CalVer only)
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            scripts
            packaging
            utils/zpkg

      # Re-download what a user actually gets. The pre-publish check sees the
      # build directory; this one sees GitHub's assets and the release BODY,
      # which can survive a re-upload with a different key.
      - name: Download the published release
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" -D dist
          gh release view "${RELEASE_TAG}" --json body --jq .body > dist/published-notes.md
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' > dist/asset-names.txt
          chmod +x dist/zpkg-linux-x86_64

      - name: Everything published must agree with everything pinned
        run: |
          scripts/check-release-consistency.sh \
            --assets dist --tools dist \
            --notes dist/published-notes.md \
            --asset-list dist/asset-names.txt \
            --versions --date "${CALVER}" \
            --zpkg dist/zpkg-linux-x86_64
