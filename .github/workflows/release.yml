name: Release (Ubuntu 22.04 baseline)

# What this lane is, and why it exists next to ci.yml.
#
# ci.yml builds on Arch and publishes container images. Those images carry their
# own libc, so they are self-consistent -- but any native artifact taken out of
# them needs whatever glibc the image had (2.43 at the time of writing, from
# three sqrtf/atan2f relocations), which is newer than Ubuntu 24.04 and every
# other LTS. The rule this workflow enforces is the one that matters to a user:
# the released toolchain is compiled against glibc 2.35 (Ubuntu 22.04) and is
# then installed, compiled against and run by a machine that has nothing but a
# normal dev environment and the release itself.
#
# Three jobs, deliberately different in kind:
#   toolchain  build *inside* Ubuntu 22.04 (docker/release-jammy/Containerfile: apt
#              packages, and GCC 16 from the Ubuntu toolchain PPA since the tree
#              needs -freflection), package, sign, publish to a GitHub Release.
#              Nothing is cross-compiled: the compiler, binutils, wayland-scanner
#              and the libraries are the distro's own, so the artifact's glibc
#              floor is the floor of the machine that built it -- and it is the
#              same compiler package a jammy user installs.
#   consume    NO container, NO checkout of build outputs: a fresh jammy runner
#              downloads that release, installs it with zpkg as an unprivileged
#              user, builds a consumer app against it and checks the glibc floor
#              of what got installed. If this job passes, the release installs,
#              links and loads on jammy -- which is the claim the release makes.
#   render     the frame itself, on a runner whose *driver* meets the engine's
#              floor. jammy cannot be that runner: its Mesa is 23.x and lavapipe
#              only grew VK_EXT_descriptor_heap in Mesa 26.2, which no PPA
#              publishes for jammy. So this job runs on noble, installs the same
#              published release, and runs the cube binary the jammy job built.
#              The release under test does not change; only the machine with the
#              Vulkan driver does.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update'
        required: true
        default: 'v0.1.0-baseline'
      gcc_version:
        description: 'GCC version to download and build with (released 16.x; reflection needs 16)'
        required: false
        default: '16.2.0'

# Releases are created and updated with the workflow token.
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GCC_VERSION: ${{ inputs.gcc_version || '16.2.0' }}
  # The installed binaries are named after the major (gcc-16 / g++-16), so the
  # pin above can move to 16.3 without touching a single CMake flag.
  GCC_BIN_SUFFIX: '16'
  # Ubuntu 22.04 LTS. Anything a release links must stay at or below this, or
  # the artifact only runs on a distro newer than the one it claims to target.
  GLIBC_BASELINE: '2.35'

# A release never runs concurrently with itself: two jobs publishing to the same
# tag would upload half of one build and half of another.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  toolchain:
    name: Toolchain (native Ubuntu 22.04, glibc 2.35)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # The compiler cache is what makes an iteration cheap: the build directory is
      # thrown away every run, so without it every translation unit -- including all
      # of slang -- is compiled again, to produce objects that were already correct.
      # There used to be a second cache here, for the cross-build sysroot. The build
      # is native now, so there is no sysroot to cache; the toolchain itself is a
      # Docker layer.
      - name: Restore the compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-

      # The tree is mounted into the image at run time rather than baked into it, so
      # these are just part of the checkout. All fourteen are needed by a *release*
      # build for a reason the journal records one by one: slang and glfw because the
      # engine links both and jammy has no slang at all and ships GLFW 3.3, the rest
      # because jammy holds no copy (simdjson 5.x, Vulkan headers 1.4) or one too old
      # for what the renderer targets.
      # --recursive is not optional: extern/slang builds from its own submodules
      # (miniz, lz4, cmark, spirv-headers, spirv-tools, glslang, unordered_dense)
      # and configures them as source directories. Without them the configure stops
      # with "does not contain a CMakeLists.txt" for each one.
      - name: Fetch vendored trees
        run: |
          git submodule update --init --recursive --depth 1 \
            extern/JoltPhysics \
            extern/VulkanMemoryAllocator \
            extern/Vulkan-Headers \
            extern/SPIRV-Reflect \
            extern/volk \
            extern/meshoptimizer \
            extern/mimalloc \
            extern/miniaudio \
            extern/cgltf \
            extern/clay \
            extern/stb \
            extern/glfw \
            extern/simdjson \
            extern/slang

      # Only needed when ZHLN_SLANG_VENDORED=ON builds the pinned tree instead of
      # using the prebuilt in the image: slang's own CMake takes its version from
      # `git describe`, and a shallow submodule has no tags, so ask the remote for
      # them explicitly and hand the result over as SLANG_VERSION_FULL.
      - name: Resolve the vendored slang version
        id: slang
        run: |
          git -C extern/slang fetch --tags --depth 1 origin || true
          version=$(git -C extern/slang describe --tags --abbrev=0 || true)
          if [ -z "${version}" ]; then
            version=$(git -C extern/slang log -1 --format=%cd --date=format:%Y.%m.%d || true)
            echo "warning: no slang tag found; using the checkout date '${version}'" >&2
          fi
          version=${version#v}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "vendored slang version: ${version}"

      # The release builder is only tooling: ubuntu:22.04 plus the jammy packages a
      # build needs. It clones the repository inside the image to get its
      # provisioning scripts (no build-context COPY), pinned to this commit;
      # the sources are still mounted at /workspace at run time. The GHA layer
      # cache restores everything else.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Ubuntu 22.04 release builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/release-jammy/Containerfile
          build-args: |
            ZHLN_GIT_URL=${{ github.server_url }}/${{ github.repository }}.git
            ZHLN_GIT_REF=${{ github.sha }}
          tags: zahlen-release-builder:jammy
          load: true
          cache-from: type=gha,scope=zahlen-release-builder
          cache-to: type=gha,mode=max,scope=zahlen-release-builder

      # Everything below runs as a user on a jammy machine: the compiler, binutils,
      # wayland-scanner and the libraries are the distro's own, so there is no target
      # prefix to mount and nothing foreign to run.
      - name: Build, test and package
        run: |
          # dist must exist here, created by this user, before docker runs: the
          # daemon creates a missing bind-mount source as root, and then every
          # write from the host into it fails -- `} > dist/release-notes.md` dies
          # with "Permission denied" after a build that succeeded completely. The
          # container still writes the packages as root; that is fine, they are
          # only ever read.
          rm -rf dist
          mkdir -p dist .ccache
          docker run --rm \
            -v "${PWD}:/workspace" -w /workspace \
            -v "${PWD}/dist:/dist" \
            -v "${PWD}/.ccache:/ccache" \
            -e CCACHE_DIR=/ccache \
            -e ZHLN_GLIBC_BASELINE="${GLIBC_BASELINE}" \
            -e ZHLN_SLANG_VERSION="${{ steps.slang.outputs.version }}" \
            zahlen-release-builder:jammy bash scripts/build-release-toolchain.sh /dist

      # A second look from the host, on the packaged archives rather than a build
      # tree: this is the same guard the consumer job applies after installing.
      - name: Check the glibc floor of the published packages
        run: scripts/check-glibc-floor.sh "${GLIBC_BASELINE}" dist/packages dist/tools

      - name: Write release notes
        run: |
          id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' dist/packages/toolchain.json)
          fingerprint=$(cat dist/tools/KEY-FINGERPRINT.txt)
          compiler=$(sed -n 's/.*"compiler":"\([^"]*\)".*/\1/p' dist/packages/toolchain.json)
          compiler_version=$(sed -n 's/.*"compiler_version":"\([^"]*\)".*/\1/p' dist/packages/toolchain.json)
          {
            echo "Toolchain \`${id}\`, ${compiler} ${compiler_version}."
            echo
            echo "* glibc baseline: **${GLIBC_BASELINE}**, enforced by \`scripts/check-glibc-floor.sh\`"
            echo "* release key fingerprint: \`${fingerprint}\`"
            backends=$(cat dist/window-backends.txt || echo 'wayland=ON x11=OFF')
            echo "* window backends: ${backends} (GLFW is vendored and static; Wayland is the primary backend)"
            echo "* built natively on Ubuntu 22.04 (no sysroot, no cross-compilation)"
            echo '* with that distro'"'"'s own released GCC 16. Consumers need GNU >= 16.1.1,'
            echo '  not the exact patch version that built this release.'
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo 'zpkg key add zahlen-release-key.pub --name "zahlen release"'
            echo 'zpkg install . --require-checksums --require-signatures'
            echo '```'
            echo
            echo '## Build against it'
            echo
            echo '```sh'
            echo 'tar -xzf cube-consumer-*.tar.gz -C consumer'
            echo 'cmake -S consumer -B consumer-build -G Ninja \'
            echo '  -DCMAKE_BUILD_TYPE=Release \'
            echo "  -DCMAKE_CXX_COMPILER=g++-${GCC_BIN_SUFFIX} \\"
            echo '  -DCMAKE_PREFIX_PATH="$(zpkg prefix)"'
            echo 'cmake --build consumer-build'
            echo '```'
            echo
            echo 'The release was built with a released GCC 16, not the trunk'
            echo 'snapshot Ubuntu 22.04 offers. Get it with the script in this repository,'
            echo 'which downloads it, checks the version and compiles a probe with it:'
            echo
            echo '```sh'
            echo 'sudo scripts/install-gcc-prebuilt.sh 16.2.0 /opt/gcc16'
            echo 'export PATH=/opt/gcc16/bin:$PATH'
            echo '```'
            echo
            echo 'Or `sudo scripts/ci-ubuntu-2204-env.sh --consumer`, which does that and'
            echo 'installs the runtime libraries as well.'
            echo
            echo 'That is not only for building against the toolchain: the engine and the'
            echo 'tools were compiled by that GCC, so they need its runtime at run time --'
            echo '`GLIBCXX_3.4.36` and `GCC_13.0.0`, where 22.04 ships 3.4.30. The script'
            echo 'installs that runtime and registers it with `ldconfig`, which is also why'
            echo 'it has to run as root. Nothing else is implied -- the release'
            echo 'carries its own GLFW (static, inside `libzahlen_engine`), so no'
            echo '`libglfw3` is required, and the GLIBC_2.35 floor is checked before'
            echo 'anything is published.'
          } > dist/release-notes.md
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # stderr stays visible: an auth problem should say so, not look like a
          # missing release and send the run down the "create" branch.
          if gh release view "${RELEASE_TAG}" >/dev/null; then
            # Package names carry the commit hash, so `--clobber` can only ever
            # replace an asset built from the *same* commit: re-releasing the same
            # tag from a newer commit leaves the previous generation in place,
            # while the new SHA256SUMS describes only the new one. The release
            # then holds two sets of packages, and `zpkg install
            # --require-checksums` refuses the downloaded directory with
            # "<pkg> ... is missing from dist/SHA256SUMS" -- which is exactly how
            # the first green build after the dir fixes failed.
            #
            # A release has to carry one generation, so drop every asset this
            # build is not about to re-upload: what stays is exactly `dist/`.
            # That includes the rendered frame an earlier run attached -- the
            # consumer job re-attaches it with `--clobber` when it renders, so
            # the frame is missing only while a run is in flight or when the
            # consumer half is failing, which is information rather than damage.
            keep=$(cd dist && printf '%s\n' packages/* tools/* | sed 's|.*/||')
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                printf '%s\n' "${keep}" | grep -Fxq -- "${asset}" ||
                  gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
              done
            gh release upload "${RELEASE_TAG}" dist/packages/* dist/tools/* --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file dist/release-notes.md \
              dist/packages/* dist/tools/*
          fi
          gh release view "${RELEASE_TAG}" --json assets \
            --jq '.assets[] | "\(.size|tostring|.[0:7])B  \(.name)"' | sort

      # Saved even when the build failed -- that is precisely the case where the next
      # attempt should not start from zero. ccache writes each object as it compiles,
      # so a failure at 80% leaves 80% of the engine in here, and the next run
      # recompiles only the rest.
      #
      # Two things are deliberate rather than tidy:
      #   the key is written out here instead of taken from the restore step's
      #     `cache-primary-key`, so a restore that failed (cache service, expired
      #     entry) cannot leave this step with an empty key and lose the whole cache;
      #   the directory is created first, because an earlier step can fail before
      #     `mkdir -p .ccache` ever ran -- and `cache/save` treats a missing path as
      #     an error, which would paint a second red step over the real failure.
      - name: Make sure the compiler cache directory exists
        if: always()
        run: mkdir -p .ccache

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}

      # `if-no-files-found: warn`: when the build fails there is no dist/, and an
      # error here would just paint a second red step over the real failure.
      - name: Upload the packaged artifacts as a run artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zahlen-release-dist
          path: |
            dist/packages/
            dist/tools/
            dist/release-notes.md
          if-no-files-found: warn
          retention-days: 7

  consume:
    name: Consume the release (bare jammy, no container)
    needs: toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # This job deliberately downloads nothing but the release: the whole point
      # is that the published artifacts are sufficient. The repository is here
      # only for the environment script, which is the same one the build job ran
      # -- that is what makes "the runtime deps" identical on both sides.
      - name: Checkout repository (for the environment script only)
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: scripts

      - name: Download the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" -D dist
          ls -la dist

      # The compiler is not guessed from the workflow inputs: the toolchain
      # descriptor in the release says which GCC built it, and the package
      # config refuses any other compiler version.
      - name: Read the toolchain descriptor
        id: tc
        run: |
          id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' dist/toolchain.json)
          gcc=$(sed -n 's/.*"compiler_version":"\([0-9][0-9]*\).*/\1/p' dist/toolchain.json)
          profile=$(sed -n 's/.*"profile":"\([^"]*\)".*/\1/p' dist/toolchain.json)
          test -n "${id}" && test -n "${gcc}"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "gcc=${gcc}" >> "$GITHUB_OUTPUT"
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "toolchain ${id} (gcc ${gcc}, ${profile})"

      - name: Provision a normal dev environment
        run: scripts/ci-ubuntu-2204-env.sh --consumer --gcc "${{ steps.tc.outputs.gcc }}" --glibc-baseline "${GLIBC_BASELINE}"

      - name: Install the toolchain from the release, unprivileged
        run: |
          # A bare jammy runner has no ~/.local/bin and `install` does not create
          # leading directories: without this the step dies before it installs
          # anything, with "cannot create regular file ...: No such file or
          # directory", on a release that is perfectly good.
          mkdir -p "${HOME}/.local/bin"
          install -m755 dist/zpkg-linux-x86_64 "${HOME}/.local/bin/zpkg"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"
          zpkg --version
          # The manager binary ships separately from the packages, so it has its
          # own sums file (the packages' SHA256SUMS is zpkg's own contract).
          ( cd dist && sha256sum -c SHA256SUMS.tools )
          zpkg key add dist/zahlen-release-key.pub --name "zahlen release"
          zpkg key list
          # No ZHLN_ROOT: the default per-user store is what a developer gets.
          zpkg install dist --require-checksums --require-signatures
          zpkg list
          zpkg prefix | tee "${RUNNER_TEMP}/prefix.txt"
          zpkg which zcook | tee "${RUNNER_TEMP}/zcook.txt"

      - name: Build the consumer app against the installed toolchain
        run: |
          prefix=$(cat "${RUNNER_TEMP}/prefix.txt")
          mkdir -p consumer
          tar -xzf "dist/cube-consumer-${{ steps.tc.outputs.id }}.tar.gz" -C consumer
          cmake -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="gcc-${{ steps.tc.outputs.gcc }}" \
            -DCMAKE_CXX_COMPILER="g++-${{ steps.tc.outputs.gcc }}" \
            -DCMAKE_PREFIX_PATH="${prefix}" \
            -DZahlen_SANITIZER_PROFILE="${{ steps.tc.outputs.profile }}"
          cmake --build consumer-build --verbose
          # Nothing may reach back into a checkout: the store is the only source.
          if grep -Fq "${GITHUB_WORKSPACE}/src" consumer-build/build.ninja; then
            echo 'FAIL: the consumer build references engine sources' >&2
            grep -Fn "${GITHUB_WORKSPACE}/src" consumer-build/build.ninja >&2
            exit 1
          fi

      # Rendering deliberately does not happen here. This job's lavapipe is
      # jammy's Mesa 23.x, which does not expose VK_EXT_descriptor_heap or
      # VK_KHR_maintenance5 -- the engine requires both (RenderInitDevice.cpp),
      # so device creation cannot succeed on this runner no matter how the
      # release was built. The `render` job runs the same binary on a driver
      # above that floor. Handing it over keeps the two claims apart: this job
      # proves the release *installs and links on jammy*, that one proves it
      # *runs*.
      - name: Hand the built consumer to the render job
        uses: actions/upload-artifact@v4
        with:
          name: zahlen-consumer-cube
          path: consumer-build/cube
          if-no-files-found: error
          retention-days: 7

      # Same guard as the build side, but on what actually got installed into
      # the user's store -- the artifact the user runs, not the build tree.
      - name: Check the installed packages against the baseline
        run: scripts/check-glibc-floor.sh "${GLIBC_BASELINE}" "$(cat "${RUNNER_TEMP}/prefix.txt")"

  render:
    name: Render the frame (driver above the engine's floor)
    needs: consume
    # noble, because it is the only LTS with a Mesa new enough to run this
    # engine on a CPU: lavapipe implements VK_EXT_descriptor_heap first in Mesa
    # 26.2, and kisak-mesa publishes 26.2.x for noble but not for jammy. The
    # artifact under test is unchanged -- the release built on jammy, installed
    # by the same zpkg, running the binary the consume job compiled.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Everything the release runs is looked up through the dynamic loader, so
      # this job provisions the machine the way the documented consumer does:
      # `ci-ubuntu-2204-env.sh --consumer` runs this very script. It installs the
      # pinned GCC 16 and registers its libstdc++ with ldconfig.
      - name: Checkout repository (for the toolchain runtime installer)
        uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: scripts

      - name: Install the compiler runtime the release was built against
        run: |
          # The release asks the loader for GLIBCXX_3.4.36 and GCC_13.0.0:
          # jammy ships 3.4.30, noble 3.4.33, and no distro has 3.4.36. Without
          # this the cube dies in the loader before main() --
          #   version `GLIBCXX_3.4.36' not found (required by .../libzahlen_engine.so)
          # -- which no amount of Vulkan driver can fix.
          sudo scripts/install-gcc-prebuilt.sh 16.2.0 /opt/gcc16

      - name: Install a Vulkan driver the engine can use
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -qq
          # The driver, plus the runtime libraries `ci-ubuntu-2204-env.sh
          # --consumer` installs on jammy, in noble's spelling (`libcurl4t64`):
          # the engine's shared objects dlopen/link these before Vulkan is even
          # reached, and this job runs the jammy-built cube on a machine that was
          # never provisioned for it.
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools netpbm \
            libzstd1 libatomic1 libcurl4t64 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxkbcommon0 libdecor-0-0 \
            zstd unzip
          apt-cache policy mesa-vulkan-drivers | sed -n '1,4p' | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # Say exactly what is missing rather than letting the cube fail at device
      # creation with one line per extension.
      - name: Check the driver against the extensions the engine requires
        run: |
          vulkaninfo > "${RUNNER_TEMP}/vulkaninfo.txt" 2>/dev/null || true
          missing=
          for ext in VK_EXT_descriptor_heap VK_KHR_maintenance5 VK_EXT_extended_dynamic_state3; do
            grep -q -- "${ext}" "${RUNNER_TEMP}/vulkaninfo.txt" || missing="${missing} ${ext}"
          done
          if [ -n "${missing}" ]; then
            echo "error: the installed driver does not expose:${missing}" >&2
            echo "       this job needs Mesa 26.2 or newer (or NVIDIA 610+); the" >&2
            echo "       engine requires these extensions at device creation." >&2
            exit 1
          fi
          grep -E 'deviceName|driverInfo|apiVersion' "${RUNNER_TEMP}/vulkaninfo.txt" | head -3 \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # No checkout in this job, so `gh` has no git remote to infer the
      # repository from and fails with "failed to run git: fatal: not a git
      # repository" before it ever reaches the network. GH_REPO says which
      # repository directly, which is also why this job needs no source tree.
      - name: Download the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" -D dist
          ls -la dist | head

      - name: Install it unprivileged
        run: |
          mkdir -p "${HOME}/.local/bin"
          install -m755 dist/zpkg-linux-x86_64 "${HOME}/.local/bin/zpkg"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"
          ( cd dist && sha256sum -c SHA256SUMS.tools )
          zpkg key add dist/zahlen-release-key.pub --name "zahlen release"
          zpkg install dist --require-checksums --require-signatures

      - name: Take the consumer the jammy job built
        uses: actions/download-artifact@v4
        with:
          name: zahlen-consumer-cube
          path: consumer-build

      # The consumer writes a non-constant PPM or the step fails, so "it ran"
      # cannot be a blank frame.
      - name: Render a cube
        run: |
          mkdir -p out
          # Artifacts do not carry file modes (upload-artifact: "all files will
          # have 644"), so the binary the jammy job compiled arrives without its
          # executable bit. Put it back; nothing else about the file changed.
          chmod +x consumer-build/cube
          # Without this, a cube that never ran only shows up as the `grep`
          # below failing, which reports "the rendered frame was blank" -- the
          # wrong diagnosis, as this very failure showed.
          set -o pipefail
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          export VK_ICD_FILENAMES="${VK_DRIVER_FILES}"
          echo "ICD: ${VK_DRIVER_FILES}"
          ./consumer-build/cube out/cube.ppm 2>&1 | tee out/render.log
          # Lowercase: the cube prints this with std::println("... nonconstant={}",
          # bool), and std::format spells booleans true/false. The former
          # `nonconstant=True` here could never match, so a perfectly good frame
          # was reported as blank.
          grep -q 'nonconstant=true' out/render.log || {
            echo 'FAIL: the rendered frame was blank' >&2
            grep -F 'nonconstant=' out/render.log >&2 || true
            exit 1
          }
          pnmtopng out/cube.ppm >"out/zahlen-cube-${RELEASE_TAG}.png"
          file "out/zahlen-cube-${RELEASE_TAG}.png"

      - name: Upload the frame and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zahlen-release-render
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Attach the rendered frame to the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${RELEASE_TAG}" "out/zahlen-cube-${RELEASE_TAG}.png" --clobber
