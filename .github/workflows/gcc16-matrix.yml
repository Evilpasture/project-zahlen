name: GCC 16.x compiler matrix

# A compiler-compatibility lane, not a shipping lane. ci.yml publishes images
# and release.yml publishes the jammy toolchain; this workflow answers one
# question per cell: "does THIS exact GCC 16.x still compile what the engine
# needs?" Each version is its own job so a regression on 16.1.1 cannot be hidden
# by a green 16.2.0, and the ABI id in cmake/Toolchains.cmake folds the exact
# compiler version into every package -- so versions must be tested separately,
# not collapsed into "latest 16".
#
# Clang is deliberately absent: it has no -freflection in this tree's sense, and
# cmake/ReflectionConfig.cmake takes the transpiler fallback for it. That is a
# supported configuration, but it is not a GCC 16.x compiler question.
#
# The matrix is data, not YAML: .github/gcc16/compilers.json holds the versions,
# runners and immutable URL+sha256 pins. Adding GCC 16.3.0 is a one-line edit
# there (flip `available` once its artifacts exist), not a change to this file.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  # Full engine builds are expensive and gate nothing, so they run weekly
  # instead of on every push. Path filters do not apply to schedule/dispatch.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate = fast compiler probes (default); full = engine configure + build'
        required: false
        default: 'gate'
        type: choice
        options: [gate, full]
      all_cells:
        description: 'Also plan cells whose pinned artifacts are not published yet (they will fail with a clear reason)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Resolve the compiler matrix
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
      mode: ${{ steps.plan.outputs.mode }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # Fails early on a bad pin, a moving URL, or drift between the conda pins
      # here and scripts/install-gcc-prebuilt.sh -- before any runner is spent.
      - name: Verify the manifest
        run: python3 scripts/gcc16_matrix.py verify

      - name: Plan
        id: plan
        env:
          ZHLN_EVENT: ${{ github.event_name }}
          ZHLN_MODE: ${{ inputs.mode }}
          ZHLN_ALL_CELLS: ${{ inputs.all_cells }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ZHLN_EVENT" ]; then args+=(--event "$ZHLN_EVENT"); fi
          if [ -n "$ZHLN_MODE" ]; then args+=(--mode "$ZHLN_MODE"); fi
          if [ "$ZHLN_ALL_CELLS" = "true" ]; then export ZHLN_GCC16_ALL_CELLS=1; fi
          python3 scripts/gcc16_matrix.py plan "${args[@]}"

      - name: Report the plan
        run: |
          echo "::notice::${{ steps.plan.outputs.summary }}"
          python3 scripts/gcc16_matrix.py list

  gcc16:
    name: ${{ matrix.label }} [${{ needs.plan.outputs.mode }}]
    needs: plan
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The fast gate needs no third-party tree. A full build may fall back
          # to the pinned submodules when a system package is unavailable.
          submodules: ${{ needs.plan.outputs.mode == 'full' && matrix.full_build }}

      # ------------------------------------------------------------- Linux --
      - name: Base tools (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd unzip curl ninja-build cmake

      - name: Install pinned compiler (Linux)
        if: matrix.platform == 'linux'
        env:
          CELL_ID: ${{ matrix.id }}
        run: |
          bash scripts/install-gcc16.sh \
            --cell "$CELL_ID" \
            --prefix "$RUNNER_TEMP/zahlen-gcc16/$CELL_ID"

      - name: Compiler capability gate (Linux)
        if: matrix.platform == 'linux'
        run: bash scripts/check-gcc16-toolchain.sh --cc "$CC" --cxx "$CXX"

      - name: Engine dependencies (Linux, full mode)
        if: matrix.platform == 'linux' && needs.plan.outputs.mode == 'full' && matrix.full_build
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip libvulkan-dev glslang-tools mesa-vulkan-drivers \
            libglfw3-dev libluajit-5.1-dev libzstd-dev libcurl4-openssl-dev \
            libssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libwayland-dev libxkbcommon-dev zlib1g-dev

      - name: Configure, build and test (Linux, full mode)
        if: matrix.platform == 'linux' && needs.plan.outputs.mode == 'full' && matrix.full_build
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          # The conda wrappers give cc1plus its own libstdc++ but emit binaries
          # without an rpath. On ubuntu-24.04 those binaries need GLIBCXX_3.4.36,
          # which the runner does not have, so give the build tree an explicit
          # runtime path and put it on LD_LIBRARY_PATH for the test run only (not for
          # apt/cmake, which are host binaries).
          runtime_lib="$ZHLN_GCC16_PREFIX/lib"
          if [ "$ZHLN_GCC16_KIND" = "arch-pkg" ]; then
            runtime_lib="$ZHLN_GCC16_PREFIX/usr/lib"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_BUILD_RPATH="$runtime_lib"
          cmake --build build --parallel
          # This tree replaces CTest with its own ztest orchestrator (see
          # cmake/ZTest.cmake); `ctest --test-dir build` would find no tests and
          # pass vacuously. Only the zpkg subproject uses CTest.
          LD_LIBRARY_PATH="$runtime_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ./build/bin/ztest --test-dir build -V

      # ------------------------------------------------------ MSYS2 UCRT64 --
      # MSYS2 provides the POSIX shell, cmake/ninja and unzip. The compiler
      # itself comes from the cell's pinned archive: pacman's gcc is a moving
      # target, and a matrix by definition must not move.
      - name: Set up MSYS2 UCRT64
        if: matrix.platform == 'ucrt64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            curl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install pinned compiler (UCRT64)
        if: matrix.platform == 'ucrt64'
        shell: msys2 {0}
        env:
          CELL_ID: ${{ matrix.id }}
        run: |
          bash scripts/install-gcc16.sh \
            --cell "$CELL_ID" \
            --prefix "$HOME/zahlen-gcc16/$CELL_ID"

      - name: Compiler capability gate (UCRT64)
        if: matrix.platform == 'ucrt64'
        shell: msys2 {0}
        run: bash scripts/check-gcc16-toolchain.sh --cc "$CC" --cxx "$CXX"

      - name: Configure and build (UCRT64, full mode)
        if: matrix.platform == 'ucrt64' && needs.plan.outputs.mode == 'full' && matrix.full_build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX"
          cmake --build build --parallel

      - name: Report the compiler under test
        shell: bash
        run: |
          echo "cell=${{ matrix.id }}"
          echo "requested=${{ matrix.gcc }}"
          echo "reported=$ZHLN_GCC16_VERSION"
          echo "kind=$ZHLN_GCC16_KIND"
          echo "prefix=$ZHLN_GCC16_PREFIX"
