name: Zahlen CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build up to the builder stage and execute CTest
      # If CTest encounters a failure, the action fails here
      - name: Build Engine and Run CTest Suite
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Package runtime image (only reaches here if tests passed)
      - name: Package Runtime Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          tags: zahlen:latest
          load: true
          cache-from: type=gha
