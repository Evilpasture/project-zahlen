name: Zahlen CI Pipeline

# The shipping lane. Everything here is on the path to a published image, so
# nothing in this file may wait on work that is not on that path.
#
# ASan/UBSan is NOT here: it lives in ci-sanitizers.yml. A matrix job is a single
# job id, so `needs: build` used to mean "wait for the asan leg too" -- an hour
# of instrumented compile sat in front of every release step, three times over
# (build, test, toolchain-test). Two workflows instead of one matrix means the
# release lane finishes when the release work finishes.
#
# Windows zpkg stays here. It does not gate deploy, it is quick, and it belongs
# with the other shipping targets.

on:
  # A documentation-only push to main cannot change a compiled artefact, so it
  # neither rebuilds nor republishes anything. This filter is on `push` only: on
  # pull requests a skipped workflow reports no checks at all, and a required
  # check that never reports leaves the PR waiting forever.
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]

# Build and Deploy publish images to the GitHub Container Registry. Fork pull
# requests receive a read-only token, so publishing is skipped there and each job
# falls back to the shared Actions build cache. The scopes are granted per job
# below so that Test stays read-only.
permissions:
  contents: read

# The image clones the tree itself (docker/ci/Containerfile) and fetches only the
# ten submodules with no Arch package; glfw, simdjson, vulkan-headers,
# shader-slang and LuaJIT come from pacman and their CMake probes prefer the
# system copy. No host-side submodule checkout feeds a Docker context any more;
# `actions/checkout` below stays only so build-push-action can resolve
# `file: docker/ci/Containerfile` from the (otherwise unused) context.

# PR updates supersede earlier runs of that PR. Pushes use unique groups so
# independent commits can build and test concurrently instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare image names
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.names.outputs.base }}
      image_key: ${{ steps.names.outputs.image_key }}
      publish: ${{ steps.names.outputs.publish }}
    steps:
      - name: Compute image names
        id: names
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          publish=true
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            publish=false
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # A failed-jobs-only rerun reuses prepare's output and the builders
          # that already succeeded. A full rerun receives a fresh attempt key.
          echo "image_key=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build (release)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Test generated package config
        run: python3 tests/cmake/test-package-config.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Containerfile
          target: builder
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: |
            ${{ needs.prepare.outputs.base }}-builder:${{ needs.prepare.outputs.image_key }}-release
            ${{ needs.prepare.outputs.base }}-builder:${{ github.sha }}-release
          build-args: |
            ZHLN_USE_SANITIZERS=OFF
            ZHLN_GIT_URL=${{ github.server_url }}/${{ github.repository }}.git
            ZHLN_GIT_REF=${{ github.sha }}
          cache-from: type=gha,scope=zahlen-release
          cache-to: type=gha,scope=zahlen-release,mode=max

  test:
    name: Test (release)
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Forks cannot publish; recreate that variant using its cache scope.
      # Published runs must test the exact pushed artifact, not a silent rebuild.
      - name: Resolve builder image
        id: image
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          IMAGE_KEY: ${{ needs.prepare.outputs.image_key }}
        run: |
          if [ "$PUBLISH" = true ]; then
            ref="${BASE}-builder:${IMAGE_KEY}-release"
            docker pull "$ref"
          else
            ref="zahlen-builder:release-local"
            docker buildx build -f docker/ci/Containerfile --target builder --load -t "$ref" \
              --build-arg "ZHLN_USE_SANITIZERS=OFF" \
              --build-arg "ZHLN_GIT_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
              --build-arg "ZHLN_GIT_REF=$GITHUB_SHA" \
              --cache-from "type=gha,scope=zahlen-release" .
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Run ztest suite
        run: |
          set -o pipefail
          docker run --rm "${{ steps.image.outputs.ref }}" \
            ./build/bin/ztest --test-dir build -V 2>&1 | tee ztest.log

      - name: Upload ztest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztest-log-release
          path: ztest.log
          if-no-files-found: ignore

  toolchain-test:
    name: Installed packages / Lavapipe (release)
    runs-on: ubuntu-latest
    needs: [prepare, build, test]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Forks cannot publish; recreate that variant using its cache scope.
      # Published runs must test the exact pushed artifact, not a silent rebuild.
      - name: Resolve builder image
        id: image
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          IMAGE_KEY: ${{ needs.prepare.outputs.image_key }}
        run: |
          if [ "$PUBLISH" = true ]; then
            ref="${BASE}-builder:${IMAGE_KEY}-release"
            docker pull "$ref"
          else
            ref="zahlen-builder:release-local"
            docker buildx build -f docker/ci/Containerfile --target builder --load -t "$ref" \
              --build-arg "ZHLN_USE_SANITIZERS=OFF" \
              --build-arg "ZHLN_GIT_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
              --build-arg "ZHLN_GIT_REF=$GITHUB_SHA" \
              --cache-from "type=gha,scope=zahlen-release" .
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # No sudo, no root, no LD_LIBRARY_PATH: the script re-executes itself as an
      # unprivileged user and installs the packages with zpkg into ~/.local.
      - name: Install engine packages with zpkg and render app/cube.cpp
        run: |
          mkdir -p toolchain-output
          docker run --rm --entrypoint bash \
            -v "$PWD/toolchain-output:/pkg-output" \
            "${{ steps.image.outputs.ref }}" scripts/test-toolchain-install.sh

      - name: Upload toolchain packages and rendered frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zahlen-toolchain-release
          path: toolchain-output/
          if-no-files-found: error

  # Windows is a shipping target for zpkg, and the Windows build is a different
  # program underneath: extended-length paths, _wfopen instead of std::ofstream,
  # LockFileEx instead of flock, no symlinked shims. None of that is exercised by
  # the Linux lanes, so it is built and tested here rather than assumed.
  zpkg-windows:
    name: zpkg (Windows/MSVC)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # simdjson, zlib, zstd, OpenSSL and libcurl all ship CMake configs through
      # vcpkg, which is what utils/zpkg/CMakeLists.txt looks for.
      - name: Install dependencies
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install simdjson zlib zstd curl openssl --triplet x64-windows

      - name: Configure
        run: >
          cmake -S utils/zpkg -B build-zpkg -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build-zpkg --config Release

      - name: Test
        run: ctest --test-dir build-zpkg -C Release --output-on-failure

      - name: Report what was built
        run: build-zpkg/Release/zpkg.exe --version

  deploy:
    name: Package runtime (release)
    runs-on: ubuntu-latest
    needs: [prepare, build, test, toolchain-test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # Only fork runs build the local builder stage; published runs copy from
      # the exact tested run-tagged image via ZHLN_BUILDER_IMAGE. The builder
      # clone happens inside the image, so no host submodules are needed here.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Containerfile
          target: runner
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: |
            ${{ needs.prepare.outputs.base }}:${{ needs.prepare.outputs.image_key }}-release
            ${{ needs.prepare.outputs.base }}:${{ github.sha }}-release
            ${{ needs.prepare.outputs.base }}:${{ github.sha }}
          build-args: |
            ZHLN_USE_SANITIZERS=OFF
            ZHLN_BUILDER_IMAGE=${{ needs.prepare.outputs.publish == 'true' && format('{0}-builder:{1}-release', needs.prepare.outputs.base, needs.prepare.outputs.image_key) || 'builder' }}
            ZHLN_GIT_URL=${{ github.server_url }}/${{ github.repository }}.git
            ZHLN_GIT_REF=${{ github.sha }}
          cache-from: type=gha,scope=zahlen-release

      - name: Deploy summary
        if: needs.prepare.outputs.publish == 'true'
        run: |
          echo "### Runtime image: release" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ needs.prepare.outputs.base }}:${{ needs.prepare.outputs.image_key }}-release' >> "$GITHUB_STEP_SUMMARY"

  # Serialize only mutable-tag promotion. The run-specific build/test jobs can
  # overlap, and a slow old run cannot replace latest after a newer run.
  #
  # This is now the only promotion in CI: the sanitizer lane builds and tests on
  # its runner and publishes nothing, so `builder:latest` follows the release
  # builder rather than a sanitized one.
  publish-latest:
    name: Promote latest images
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.publish == 'true'
    concurrency:
      group: ${{ github.workflow }}-publish-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check this commit is still the main branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not promoting $GITHUB_SHA; main is now at $head_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote run-specific images to stable tags
        if: steps.head.outputs.current == 'true'
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          IMAGE_KEY: ${{ needs.prepare.outputs.image_key }}
        run: |
          # Existing builder:latest now means the release builder as well; the
          # sanitized builder is no longer published, so there is nothing else
          # for it to point at.
          docker buildx imagetools create \
            -t "${BASE}-builder:latest" -t "${BASE}-builder:release" \
            "${BASE}-builder:${IMAGE_KEY}-release"
          # Existing runtime:latest now means the speed build; both remain named.
          docker buildx imagetools create -t "${BASE}:latest" -t "${BASE}:release" \
            "${BASE}:${IMAGE_KEY}-release"
