name: Zahlen CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Build and Deploy publish images to the GitHub Container Registry. Fork pull
# requests receive a read-only token, so publishing is skipped there and each job
# falls back to the shared Actions build cache. The scopes are granted per job
# below so that Test stays read-only.
permissions:
  contents: read

# Only the libraries with no Arch package stay vendored. Slang, GLFW, simdjson,
# Vulkan-Headers and LuaJIT are provisioned by the distro inside the image, so
# cloning them (slang alone is the largest tree in the repo) is pure overhead:
# their CMake probes prefer the system copy and every shipped compiler and
# library they resolve to is a package. Jolt, VulkanMemoryAllocator,
# meshoptimizer, SPIRV-Reflect, volk, mimalloc and the header-only
# cgltf/stb/clay/miniaudio are added with add_subdirectory or included straight
# out of extern/, so they must be present.
env:
  VENDORED_SUBMODULES: >-
    extern/JoltPhysics
    extern/VulkanMemoryAllocator
    extern/SPIRV-Reflect
    extern/volk
    extern/meshoptimizer
    extern/mimalloc
    extern/miniaudio
    extern/cgltf
    extern/clay
    extern/stb

# PR updates supersede earlier runs of that PR. Pushes use unique groups so
# independent commits can build and test concurrently instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compute names once. Matrix jobs must not publish job outputs with the same
  # key: GitHub merges matrix outputs in an unspecified order.
  prepare:
    name: Prepare image names
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.names.outputs.base }}
      image_key: ${{ steps.names.outputs.image_key }}
      publish: ${{ steps.names.outputs.publish }}
    steps:
      - name: Compute image names
        id: names
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          publish=true
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            publish=false
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # A failed-jobs-only rerun reuses prepare's output and the builders
          # that already succeeded. A full rerun receives a fresh attempt key.
          echo "image_key=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # Each variant has a run-specific tag and its own GHA cache scope. Matrix
  # builds finish independently; tests start after both build variants succeed.
  build:
    name: Build (${{ matrix.variant }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: asan
            sanitizers: "ON"
          - variant: release
            sanitizers: "OFF"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch vendored libraries
        run: git submodule update --init --depth 1 ${VENDORED_SUBMODULES}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish builder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: |
            ${{ needs.prepare.outputs.base }}-builder:${{ needs.prepare.outputs.image_key }}-${{ matrix.variant }}
            ${{ needs.prepare.outputs.base }}-builder:${{ github.sha }}-${{ matrix.variant }}
            ${{ matrix.variant == 'asan' && format('{0}-builder:{1}', needs.prepare.outputs.base, github.sha) || '' }}
          build-args: |
            ZHLN_USE_SANITIZERS=${{ matrix.sanitizers }}
          cache-from: type=gha,scope=zahlen-${{ matrix.variant }}
          cache-to: type=gha,scope=zahlen-${{ matrix.variant }},mode=max

  test:
    name: Test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: asan
            sanitizers: "ON"
          - variant: release
            sanitizers: "OFF"
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Forks cannot publish; recreate that variant using its cache scope.
      # Published runs must test the exact pushed artifact, not a silent rebuild.
      - name: Resolve builder image
        id: image
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          IMAGE_KEY: ${{ needs.prepare.outputs.image_key }}
          VARIANT: ${{ matrix.variant }}
          SANITIZERS: ${{ matrix.sanitizers }}
        run: |
          if [ "$PUBLISH" = true ]; then
            ref="${BASE}-builder:${IMAGE_KEY}-${VARIANT}"
            docker pull "$ref"
          else
            git submodule update --init --depth 1 ${VENDORED_SUBMODULES}
            ref="zahlen-builder:${VARIANT}-local"
            docker buildx build --target builder --load -t "$ref" \
              --build-arg "ZHLN_USE_SANITIZERS=$SANITIZERS" \
              --cache-from "type=gha,scope=zahlen-${VARIANT}" .
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Run ztest suite
        run: |
          set -o pipefail
          docker run --rm "${{ steps.image.outputs.ref }}" \
            ./build/bin/ztest --test-dir build -V 2>&1 | tee ztest.log

      - name: Upload ztest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztest-log-${{ matrix.variant }}
          path: ztest.log
          if-no-files-found: ignore

  deploy:
    name: Package runtime (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [prepare, build, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: asan
            sanitizers: "ON"
          - variant: release
            sanitizers: "OFF"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # Only fork runs build the local builder stage; published runs copy from
      # the exact tested run-tagged image via ZHLN_BUILDER_IMAGE.
      - name: Fetch vendored libraries for fork build
        if: needs.prepare.outputs.publish != 'true'
        run: git submodule update --init --depth 1 ${VENDORED_SUBMODULES}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: |
            ${{ needs.prepare.outputs.base }}:${{ needs.prepare.outputs.image_key }}-${{ matrix.variant }}
            ${{ needs.prepare.outputs.base }}:${{ github.sha }}-${{ matrix.variant }}
            ${{ matrix.variant == 'release' && format('{0}:{1}', needs.prepare.outputs.base, github.sha) || '' }}
          build-args: |
            ZHLN_USE_SANITIZERS=${{ matrix.sanitizers }}
            ZHLN_BUILDER_IMAGE=${{ needs.prepare.outputs.publish == 'true' && format('{0}-builder:{1}-{2}', needs.prepare.outputs.base, needs.prepare.outputs.image_key, matrix.variant) || 'builder' }}
          cache-from: type=gha,scope=zahlen-${{ matrix.variant }}

      - name: Deploy summary
        if: needs.prepare.outputs.publish == 'true'
        run: |
          echo "### Runtime image: ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ needs.prepare.outputs.base }}:${{ needs.prepare.outputs.image_key }}-${{ matrix.variant }}' >> "$GITHUB_STEP_SUMMARY"

  # Serialize only mutable-tag promotion. The run-specific build/test jobs can
  # overlap, and a slow old run cannot replace latest after a newer run.
  publish-latest:
    name: Promote latest images
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.publish == 'true'
    concurrency:
      group: ${{ github.workflow }}-publish-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check this commit is still the main branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not promoting $GITHUB_SHA; main is now at $head_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote run-specific images to stable tags
        if: steps.head.outputs.current == 'true'
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          IMAGE_KEY: ${{ needs.prepare.outputs.image_key }}
        run: |
          # Preserve the existing sanitized builder:latest dev workflow.
          docker buildx imagetools create \
            -t "${BASE}-builder:latest" -t "${BASE}-builder:asan" \
            "${BASE}-builder:${IMAGE_KEY}-asan"
          docker buildx imagetools create -t "${BASE}-builder:release" \
            "${BASE}-builder:${IMAGE_KEY}-release"
          # Existing runtime:latest now means the speed build; both remain named.
          docker buildx imagetools create -t "${BASE}:latest" -t "${BASE}:release" \
            "${BASE}:${IMAGE_KEY}-release"
          docker buildx imagetools create -t "${BASE}:asan" \
            "${BASE}:${IMAGE_KEY}-asan"
