StylesPath = .vale/styles
MinAlertLevel = warning

# Default markup ignores (skips fenced code blocks and inline backticks for prose rules).
SkippedScopes = script, style, pre, figure
IgnoredScopes = code, tt

[{extern/**,third_party/**,build/**,.git/**,todo/**}]
BasedOnStyles = NONE

[*.md]
BasedOnStyles = Zahlen
Zahlen.ConsumerBoundary = NO

# Strict consumer boundary: zero CI scripts, sanitizers, or internal test names.
[docs/*.md]
Zahlen.ConsumerBoundary = YES

# Maintainer-facing docs legitimately reference scripts/ and build internals.
[docs/DEVELOPMENT.md]
Zahlen.ConsumerBoundary = NO
Zahlen.Rationalization = NO

[include/ARCHITECTURE.md]
Zahlen.ConsumerBoundary = NO
Zahlen.Rationalization = NO

# Packaging/tool READMEs: forbid sanitizer workflow leaks without banning ctest or scripts/.
[{packaging/*.md,packaging/**/*.md,utils/**/README.md}]
Zahlen.ConsumerBoundary = YES

# The policy file contains the forms it prohibits.
[AGENTS.md]
BasedOnStyles = NONE
